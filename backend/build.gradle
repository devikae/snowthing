plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.ikae'
version = '0.0.1-SNAPSHOT'
description = 'snowthing'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web & Validation
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.jsoup:jsoup:1.21.1'
    // 글 본문(Markdown)의 코드 범위와 링크 주소를 읽어 저장 전 정화에 쓴다
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
    // JPA & DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // AWS Advanced JDBC Wrapper & RDS/S3 SDK
    implementation 'software.amazon.jdbc:aws-advanced-jdbc-wrapper:2.3.7'
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:rds'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:cloudfront'
    implementation 'software.amazon.awssdk:sesv2'

    // Image thumbnail generation (WebP decoding + resize/JPEG encoding)
    implementation 'net.coobird:thumbnailator:0.4.21'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.14.0'

    // Security & Session Redis
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'

    // Querydsl Jakarta (Spring Boot 3.x)
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        if (!project.hasProperty('includeBenchmark')) {
            excludeTags 'benchmark'
        }
        // 마이그레이션 스키마 대조는 create-drop 테스트와 같은 스키마를 쓰면 안 되므로 schemaValidate로 따로 돌린다.
        excludeTags 'schema-validate'
    }
    systemProperty 'spring.profiles.active', 'test'
    // Spring 테스트 컨텍스트 캐시가 늘어 기본 512MB 힙을 넘어 OutOfMemoryError가 나므로 힙과 캐시 수에 상한을 둔다.
    maxHeapSize = '1g'
    systemProperty 'spring.test.context.cache.maxSize', '16'
    systemProperty 'chat.load.stage', project.findProperty('chatLoadStage') ?: 'target'
    // 대규모 MySQL Seed 테스트는 일반 단위·통합 테스트와 별도 실행한다.
    // 필요할 때만 ./gradlew test -PincludeBenchmark 로 명시적으로 포함한다.
}

// database/production 마이그레이션을 먼저 적용한 스키마에서 ddl-auto=validate로 컨텍스트를 띄워 엔티티와 대조한다.
// CI는 마이그레이션 검증 단계 뒤, 일반 test 전에 실행한다. 로컬은 SNOWTHING_TEST_DB_URL을 마이그레이션 적용한 스키마로 둔다.
tasks.register('schemaValidate', Test) {
    description = 'database/production 마이그레이션 스키마와 JPA 엔티티를 validate로 대조한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'schema-validate'
    }
    systemProperty 'spring.profiles.active', 'test'
    outputs.upToDateWhen { false }
}

tasks.named('processResources') {
    from('../shared/registration-policies') { into 'registration-policies' }
}

spotless {
    ratchetFrom 'origin/main'

    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat('1.22.0').aosp()
        removeUnusedImports()
        importOrder('java', 'jakarta', 'org', 'com', '')
        trimTrailingWhitespace()
        endWithNewline()
    }
}
