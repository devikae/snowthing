spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  datasource:
    url: ${SNOWTHING_TEST_DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SNOWTHING_TEST_DB_USERNAME}
    password: ${SNOWTHING_TEST_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

snowthing:
  email:
    verification:
      secret: test-email-verification-secret-at-least-32-bytes
  mail:
    provider: disabled
  # 테스트에서는 outbox 폴링·일일 대조 스케줄러를 끄고 처리기를 직접 부른다.
  search:
    indexer:
      enabled: false
    reconcile:
      enabled: false

  # 작성 API 연타 제한(request_budget_window)은 테스트 DB에 테이블이 없어 기본으로 끈다.
  write-limit:
    enabled: false
