spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  datasource:
    url: ${SNOWTHING_TEST_DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SNOWTHING_TEST_DB_USERNAME}
    password: ${SNOWTHING_TEST_DB_PASSWORD}
    # 테스트는 Spring 컨텍스트마다 풀을 따로 잡는다. 기본값 10개면 컨텍스트가 늘 때 CI MySQL 연결 한도를 넘는다.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# 실제 AWS에 닿지 않게 한다. S3를 부르는 스케줄러는 긴 주기로 두고, 버킷도 없는 이름을 쓴다.
cloud:
  aws:
    s3:
      bucket: snowthing-test-no-such-bucket

snowthing:
  post-images:
    cleanup-delay-ms: 3600000
  market-thumbnails:
    delay-ms: 3600000
  email:
    verification:
      secret: test-email-verification-secret-at-least-32-bytes
  mail:
    provider: disabled
  # 테스트에서는 outbox 폴링·일일 대조 스케줄러를 끄고 처리기를 직접 부른다.
  search:
    indexer:
      enabled: false
    reconcile:
      enabled: false

  # 작성 연타 제한과 로그인 시도 제한은 테스트끼리 같은 작성자, 같은 IP를 공유해 기본으로 끈다.
  write-limit:
    enabled: false
  login-limit:
    enabled: false
