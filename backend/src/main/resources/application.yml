spring:
  application:
    name: snowthing

  profiles:
    default: local

  jpa:
    open-in-view: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

server:
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax

---
# ==========================================
# [Profile: local] 로컬 개발 환경 (Local / Docker MySQL 8.0 연동)
# ==========================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/snowthing?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME:snowuser}
    password: ${SNOWTHING_DB_PASSWORD:snowthing_pass_2026!}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

---
# ==========================================
# [Profile: docker] 로컬 Docker Compose 환경
# ==========================================
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://mysql:3306/snowthing?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME:snowuser}
    password: ${SNOWTHING_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

---
# ==========================================
# [Profile: prod] AWS EC2 + RDS 운영 컨테이너 환경
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SNOWTHING_PROD_DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME}
    password: ${SNOWTHING_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    com.ikae.snowthing: info
