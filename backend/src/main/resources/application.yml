spring:
  application:
    name: snowthing

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  profiles:
    default: local

  jpa:
    open-in-view: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

logging:
  image-budget:
    path: ${SNOWTHING_IMAGE_BUDGET_LOG_PATH:logs/image_budget.jsonl}
  chat-audit:
    path: ${SNOWTHING_CHAT_AUDIT_LOG_PATH:logs/chat_audit.log}
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

snowthing:
  email:
    verification:
      secret: ${SNOWTHING_EMAIL_VERIFICATION_SECRET:local-development-email-verification-secret}
  mail:
    provider: ${SNOWTHING_MAIL_PROVIDER:disabled}
    region: ${SNOWTHING_SES_REGION:ap-northeast-2}
    from-address: ${SNOWTHING_MAIL_FROM:help@snowthing.org}
    from-name: ${SNOWTHING_MAIL_FROM_NAME:SnowThing}
    configuration-set: ${SNOWTHING_SES_CONFIGURATION_SET:}
  chat:
    max-connections: ${SNOWTHING_CHAT_MAX_CONNECTIONS:500}
  bot:
    enabled: ${SNOWTHING_BOT_ENABLED:false}
    base-url: ${SNOWTHING_BOT_BASE_URL:http://127.0.0.1:3100}
    internal-secret: ${SNOWTHING_BOT_INTERNAL_SECRET:}
    delegation-secret: ${SNOWTHING_BOT_DELEGATION_SECRET:}
    delegation-ttl: ${SNOWTHING_BOT_DELEGATION_TTL:60s}
    request-timeout: ${SNOWTHING_BOT_REQUEST_TIMEOUT:15s}
  ai-members:
    enabled: ${SNOWTHING_AI_MEMBERS_ENABLED:false}
    persona-file: ${SNOWTHING_AI_MEMBERS_PERSONA_FILE:}
    daily-call-limit: ${SNOWTHING_AI_MEMBERS_DAILY_CALL_LIMIT:100}
    topic-keywords: ${SNOWTHING_AI_MEMBERS_TOPIC_KEYWORDS:}
  carpool:
    external:
      connect-timeout-millis: ${SNOWTHING_CARPOOL_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${SNOWTHING_CARPOOL_READ_TIMEOUT_MILLIS:4000}
      kakao:
        rest-api-key: ${SNOWTHING_KAKAO_REST_API_KEY:}
      opinet:
        api-key: ${SNOWTHING_OPINET_API_KEY:}
  search:
    indexer:
      enabled: ${SNOWTHING_SEARCH_INDEXER_ENABLED:true}
      poll-interval-ms: ${SNOWTHING_SEARCH_INDEXER_POLL_INTERVAL_MS:1000}
      batch-size: 50
      lease-ms: 60000
      max-attempts: 5
      retry-base-delay-ms: 1000
      retry-max-delay-ms: 600000
    reconcile:
      enabled: ${SNOWTHING_SEARCH_RECONCILE_ENABLED:true}
      cron: "0 30 4 * * *"
    reindex:
      batch-size: 500
    outbox:
      done-retention-days: 7
    # 색인이 비어 있고(search_index_state 0행) 공개 게시글이 있으면 기동 때 재인덱싱을 한 번 넣는다 (indexer.enabled=true일 때만)
    bootstrap-on-empty: ${SNOWTHING_SEARCH_BOOTSTRAP_ON_EMPTY:true}
    # IKA-11 의미 검색 비교 실험. 기본 꺼짐: 제공자 호출과 비용이 없고 근거 검색은 키워드만 쓴다.
    # provider: none | hashing(로컬 파이프라인 확인용, 의미 모델 아님) | http(OpenAI 호환, 호출마다 비용 가능, 사용자 승인 후)
    semantic:
      enabled: ${SNOWTHING_SEARCH_SEMANTIC_ENABLED:false}
      provider: ${SNOWTHING_SEARCH_SEMANTIC_PROVIDER:none}
      rrf-k: ${SNOWTHING_SEARCH_SEMANTIC_RRF_K:60}
      candidate-k: ${SNOWTHING_SEARCH_SEMANTIC_CANDIDATE_K:50}
      refresh-batch-size: 32
      refresh-max-batches: 4
      refresh-idle-interval-ms: 30000
      max-vector-scan: ${SNOWTHING_SEARCH_SEMANTIC_MAX_VECTOR_SCAN:5000}
      http:
        base-url: ${SNOWTHING_SEARCH_EMBEDDING_BASE_URL:}
        model: ${SNOWTHING_SEARCH_EMBEDDING_MODEL:}
        dimension: ${SNOWTHING_SEARCH_EMBEDDING_DIMENSION:0}
        api-key: ${SNOWTHING_SEARCH_EMBEDDING_API_KEY:}
        connect-timeout-millis: 2000
        read-timeout-millis: 10000
  admin:
    # IKA-12. 쉼표 구분 이메일. 기동할 때 해당 활성 회원을 ROLE_ADMIN으로 올린다. 목록에서 빼도 권한은 거두지 않는다.
    bootstrap-emails: ${SNOWTHING_ADMIN_BOOTSTRAP_EMAILS:}
  answer-draft:
    # IKA-12. 승인된 답변 초안의 댓글 게시. 운영 기본값은 꺼짐(읽기 전용). 켜도 사람이 관리자 세션에서 승인하고 게시해야 한다.
    publish-enabled: ${SNOWTHING_ANSWER_DRAFT_PUBLISH_ENABLED:false}
  oauth2:
    frontend-base-url: ${SNOWTHING_FRONTEND_BASE_URL:http://localhost:3000}
    connect-timeout-millis: ${SNOWTHING_OAUTH2_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${SNOWTHING_OAUTH2_READ_TIMEOUT_MILLIS:4000}
    google:
      client-id: ${SNOWTHING_GOOGLE_CLIENT_ID:}
      client-secret: ${SNOWTHING_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${SNOWTHING_GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback/google}
    naver:
      client-id: ${SNOWTHING_NAVER_CLIENT_ID:}
      client-secret: ${SNOWTHING_NAVER_CLIENT_SECRET:}
      redirect-uri: ${SNOWTHING_NAVER_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback/naver}

server:
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax

cloud:
  aws:
    s3:
      bucket: ${SNOWTHING_S3_BUCKET:snowthing-media-00001}
    cloudfront:
      distribution-id: ${SNOWTHING_CLOUDFRONT_DISTRIBUTION_ID:}
      base-url: ${SNOWTHING_IMAGE_BASE_URL:https://images.snowthing.org}

---
# ==========================================
# [Profile: local] 로컬 개발 환경 (Local / Docker MySQL 8.0 연동)
# ==========================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/snowthing?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useAffectedRows=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME:snowuser}
    password: ${SNOWTHING_DB_PASSWORD:snowthing_pass_2026!}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

---
# ==========================================
# [Profile: docker] 로컬 Docker Compose 환경
# ==========================================
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://mysql:3306/snowthing?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useAffectedRows=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME:snowuser}
    password: ${SNOWTHING_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

---
# ==========================================
# [Profile: prod] AWS EC2 + RDS 운영 컨테이너 환경 (IAM 무암호 인증)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # 운영 계약: AWS Advanced JDBC Wrapper는 jdbc:aws-wrapper:mysql:// 접두사만 허용한다.
    url: ${SNOWTHING_PROD_DB_URL}
    driver-class-name: software.amazon.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME:snowthing_app}
    password: ${SNOWTHING_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        wrapperPlugins: iam
        iamExpiration: 870
        useAffectedRows: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    com.ikae.snowthing: info

snowthing:
  email:
    verification:
      secret: ${SNOWTHING_EMAIL_VERIFICATION_SECRET}
  mail:
    provider: ${SNOWTHING_MAIL_PROVIDER:ses}
    region: ${SNOWTHING_SES_REGION:ap-northeast-2}
    from-address: ${SNOWTHING_MAIL_FROM:help@snowthing.org}
    from-name: ${SNOWTHING_MAIL_FROM_NAME:SnowThing}
    configuration-set: ${SNOWTHING_SES_CONFIGURATION_SET:}
  oauth2:
    frontend-base-url: ${SNOWTHING_FRONTEND_BASE_URL:https://snowthing.org}
    google:
      redirect-uri: ${SNOWTHING_GOOGLE_REDIRECT_URI:https://snowthing.org/api/v1/auth/oauth2/callback/google}
    naver:
      redirect-uri: ${SNOWTHING_NAVER_REDIRECT_URI:https://snowthing.org/api/v1/auth/oauth2/callback/naver}
