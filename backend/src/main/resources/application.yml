spring:
  application:
    name: snowthing

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  profiles:
    default: local

  jpa:
    open-in-view: false

  # 종료 신호를 받으면 새 요청을 막고 처리 중인 요청을 최대 20초 기다린다(IKA-105).
  # 라이브톡 WebSocket은 이 단계에서 서버가 닫고 클라이언트가 다시 붙는다. 일반 API는 대부분 수 초 안에 끝난다.
  # compose.prod.yml의 stop_grace_period(30초)가 이 값보다 길어야 docker가 중간에 강제 종료하지 않는다.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

logging:
  image-budget:
    path: ${SNOWTHING_IMAGE_BUDGET_LOG_PATH:logs/image_budget.jsonl}
  chat-audit:
    path: ${SNOWTHING_CHAT_AUDIT_LOG_PATH:logs/chat_audit.log}
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

snowthing:
  # 로그인 유지 쿠키(30일). 키를 비우면 이메일 인증 비밀값에 용도 접두사를 붙여 쓴다. 운영도 새 비밀값 없이 동작한다.
  remember-me:
    key: ${SNOWTHING_REMEMBER_ME_KEY:}
  email:
    verification:
      secret: ${SNOWTHING_EMAIL_VERIFICATION_SECRET:local-development-email-verification-secret}
      # 별칭(+태그, Gmail 점)을 한 메일함으로 묶어 가입과 재설정 메일을 합쳐 센다.
      recipient-hourly-limit: 10
      recipient-daily-limit: 20
  # IP와 무관하게 한 계정의 비밀번호 실패를 센다. 짧은 창을 넘기면 짧게, 긴 창까지 넘기면 길게 잠긴다.
  login-limit:
    account:
      short-max-failures: 10
      short-window: 15m
      long-max-failures: 30
      long-window: 1h
  mail:
    provider: ${SNOWTHING_MAIL_PROVIDER:disabled}
    region: ${SNOWTHING_SES_REGION:ap-northeast-2}
    from-address: ${SNOWTHING_MAIL_FROM:help@snowthing.org}
    from-name: ${SNOWTHING_MAIL_FROM_NAME:SnowThing}
    configuration-set: ${SNOWTHING_SES_CONFIGURATION_SET:}
  # IKA-88 쪽지 도착 메일. 적재와 발송을 따로 켠다. 운영은 둘 다 끈 채 배포하고 적재부터 확인한다.
  # IKA-109: 아래 두 값은 서버 쪽 비상 차단이다. 실제 동작은 이 값과 관리자 화면 스위치(system_config의
  # DM_MAIL_ENQUEUE_ENABLED, DM_MAIL_SEND_ENABLED)가 모두 켜져 있을 때만 켜진다.
  # 발송을 켜도 mail.provider가 ses가 아니면 워커가 작업을 잡지 않는다.
  dm-mail:
    enqueue-enabled: ${SNOWTHING_DM_MAIL_ENQUEUE_ENABLED:false}
    send-enabled: ${SNOWTHING_DM_MAIL_SEND_ENABLED:false}
    cooldown: 10m
    deadline: 24h
    lease: 60s
    max-attempts: 5
    retry-base-delay: 30s
    retry-max-delay: 10m
    recipients-per-poll: 5
    retention: 30d
    stale-sweep-interval: 10m
    poll-interval-ms: 1000
    link-base-url: ${SNOWTHING_FRONTEND_BASE_URL:http://localhost:3000}
    ses:
      attempt-timeout: 3s
      call-timeout: 5s
      endpoint: ${SNOWTHING_DM_MAIL_SES_ENDPOINT:}
  chat:
    max-connections: ${SNOWTHING_CHAT_MAX_CONNECTIONS:500}
  bot:
    enabled: ${SNOWTHING_BOT_ENABLED:false}
    base-url: ${SNOWTHING_BOT_BASE_URL:http://127.0.0.1:3100}
    internal-secret: ${SNOWTHING_BOT_INTERNAL_SECRET:}
    delegation-secret: ${SNOWTHING_BOT_DELEGATION_SECRET:}
    delegation-ttl: ${SNOWTHING_BOT_DELEGATION_TTL:60s}
    request-timeout: ${SNOWTHING_BOT_REQUEST_TIMEOUT:15s}
  ai-members:
    enabled: ${SNOWTHING_AI_MEMBERS_ENABLED:false}
    persona-file: ${SNOWTHING_AI_MEMBERS_PERSONA_FILE:}
    daily-call-limit: ${SNOWTHING_AI_MEMBERS_DAILY_CALL_LIMIT:100}
    topic-keywords: ${SNOWTHING_AI_MEMBERS_TOPIC_KEYWORDS:}
    first-opening-date: ${SNOWTHING_AI_MEMBERS_FIRST_OPENING_DATE:2026-11-22}
  carpool:
    external:
      connect-timeout-millis: ${SNOWTHING_CARPOOL_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${SNOWTHING_CARPOOL_READ_TIMEOUT_MILLIS:4000}
      kakao:
        rest-api-key: ${SNOWTHING_KAKAO_REST_API_KEY:}
      opinet:
        api-key: ${SNOWTHING_OPINET_API_KEY:}
  weather:
    connect-timeout-millis: ${SNOWTHING_WEATHER_CONNECT_TIMEOUT_MILLIS:1000}
    read-timeout-millis: ${SNOWTHING_WEATHER_READ_TIMEOUT_MILLIS:2000}
    kma:
      service-key: ${SNOWTHING_KMA_SERVICE_KEY:}
  # IKA-66 슬로프 현황 수집. 수집할 리조트 코드를 쉼표로 적는다(HIGH1,YONGPYONG,KONJIAM,PHOENIX). 기본은 비어 있어 수집하지 않는다.
  slope-status:
    enabled-resorts: ${SNOWTHING_SLOPE_STATUS_ENABLED_RESORTS:}
    cron: ${SNOWTHING_SLOPE_STATUS_CRON:0 30 6-21/2 * * *}
  search:
    indexer:
      enabled: ${SNOWTHING_SEARCH_INDEXER_ENABLED:true}
      poll-interval-ms: ${SNOWTHING_SEARCH_INDEXER_POLL_INTERVAL_MS:1000}
      batch-size: 50
      lease-ms: 60000
      max-attempts: 5
      retry-base-delay-ms: 1000
      retry-max-delay-ms: 600000
    reconcile:
      enabled: ${SNOWTHING_SEARCH_RECONCILE_ENABLED:true}
      cron: "0 30 4 * * *"
    reindex:
      batch-size: 500
    outbox:
      done-retention-days: 7
    # 색인이 비어 있고(search_index_state 0행) 공개 게시글이 있으면 기동 때 재인덱싱을 한 번 넣는다 (indexer.enabled=true일 때만)
    bootstrap-on-empty: ${SNOWTHING_SEARCH_BOOTSTRAP_ON_EMPTY:true}
    # IKA-11 의미 검색 비교 실험. 기본 꺼짐: 제공자 호출과 비용이 없고 근거 검색은 키워드만 쓴다.
    # provider: none | hashing(로컬 파이프라인 확인용, 의미 모델 아님) | http(OpenAI 호환, 호출마다 비용 가능, 사용자 승인 후)
    semantic:
      enabled: ${SNOWTHING_SEARCH_SEMANTIC_ENABLED:false}
      provider: ${SNOWTHING_SEARCH_SEMANTIC_PROVIDER:none}
      rrf-k: ${SNOWTHING_SEARCH_SEMANTIC_RRF_K:60}
      candidate-k: ${SNOWTHING_SEARCH_SEMANTIC_CANDIDATE_K:50}
      refresh-batch-size: 32
      refresh-max-batches: 4
      refresh-idle-interval-ms: 30000
      max-vector-scan: ${SNOWTHING_SEARCH_SEMANTIC_MAX_VECTOR_SCAN:5000}
      http:
        base-url: ${SNOWTHING_SEARCH_EMBEDDING_BASE_URL:}
        model: ${SNOWTHING_SEARCH_EMBEDDING_MODEL:}
        dimension: ${SNOWTHING_SEARCH_EMBEDDING_DIMENSION:0}
        api-key: ${SNOWTHING_SEARCH_EMBEDDING_API_KEY:}
        connect-timeout-millis: 2000
        read-timeout-millis: 10000
  # IKA-80 AI 자동 검열. 기본 꺼짐. 켜면 글, 댓글, 장터, 카풀, 설질 제보를 쓰고 고칠 때 대기열에 넣고 1분마다 판정한다.
  # 2단계(OpenAI Moderation API)는 따로 켠다. 이용자 글이 국외(미국)로 가므로 개인정보처리방침을 고친 뒤 켠다. 키가 비어 있으면 규칙만 돈다.
  moderation:
    enabled: ${SNOWTHING_MODERATION_ENABLED:false}
    poll-interval-ms: 60000
    batch-size: 50
    lease: 5m
    max-attempts: 5
    retry-base-delay: 1m
    retry-max-delay: 30m
    hourly-alert-threshold: 10
    rules:
      enabled: true
      duplicate-window: 10m
      duplicate-min-count: 3
      duplicate-min-length: 10
      new-account-age: 24h
      new-account-min-links: 3
      short-text-length: 20
    api:
      enabled: ${SNOWTHING_MODERATION_API_ENABLED:false}
      api-key: ${SNOWTHING_OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      model: omni-moderation-latest
      hide-threshold: 0.9
      review-threshold: 0.4
      hide-categories: sexual,sexual/minors,illicit,illicit/violent
      max-inputs-per-call: 20
      connect-timeout: 3s
      read-timeout: 15s
  discord:
    # IKA-18. 비어 있으면 그 채널 알림은 꺼진다. 웹훅 URL은 비밀값이라 운영 prod.env에만 둔다.
    alert-webhook: ${DISCORD_WEBHOOK_ALERT:}
    event-webhook: ${DISCORD_WEBHOOK_EVENT:}
    timeout: 3s
  web-push:
    # IKA-65. VAPID 키(base64url)와 연락처(mailto: 또는 https:). 하나라도 비어 있으면 휴대폰 알림이 꺼진다.
    # 비밀키는 비밀값이라 운영 prod.env에만 둔다.
    public-key: ${WEB_PUSH_VAPID_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${WEB_PUSH_VAPID_SUBJECT:}
    timeout: 5s
    ttl: 1d
  admin:
    # IKA-12. 쉼표 구분 이메일. 기동할 때 해당 활성 회원을 ROLE_ADMIN으로 올린다. 목록에서 빼도 권한은 거두지 않는다.
    bootstrap-emails: ${SNOWTHING_ADMIN_BOOTSTRAP_EMAILS:}
  answer-draft:
    # IKA-12. 승인된 답변 초안의 댓글 게시. 운영 기본값은 꺼짐(읽기 전용). 켜도 사람이 관리자 세션에서 승인하고 게시해야 한다.
    publish-enabled: ${SNOWTHING_ANSWER_DRAFT_PUBLISH_ENABLED:false}
  oauth2:
    frontend-base-url: ${SNOWTHING_FRONTEND_BASE_URL:http://localhost:3000}
    connect-timeout-millis: ${SNOWTHING_OAUTH2_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${SNOWTHING_OAUTH2_READ_TIMEOUT_MILLIS:4000}
    google:
      client-id: ${SNOWTHING_GOOGLE_CLIENT_ID:}
      client-secret: ${SNOWTHING_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${SNOWTHING_GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback/google}
    naver:
      client-id: ${SNOWTHING_NAVER_CLIENT_ID:}
      client-secret: ${SNOWTHING_NAVER_CLIENT_SECRET:}
      redirect-uri: ${SNOWTHING_NAVER_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback/naver}
    kakao:
      # 카풀 지도에 쓰는 같은 카카오 앱의 REST API 키를 기본값으로 쓴다.
      client-id: ${SNOWTHING_KAKAO_LOGIN_CLIENT_ID:${SNOWTHING_KAKAO_REST_API_KEY:}}
      client-secret: ${SNOWTHING_KAKAO_LOGIN_CLIENT_SECRET:}
      redirect-uri: ${SNOWTHING_KAKAO_LOGIN_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback/kakao}

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax

cloud:
  aws:
    s3:
      bucket: ${SNOWTHING_S3_BUCKET:snowthing-media-00001}
    cloudfront:
      distribution-id: ${SNOWTHING_CLOUDFRONT_DISTRIBUTION_ID:}
      base-url: ${SNOWTHING_IMAGE_BASE_URL:https://images.snowthing.org}

---
# ==========================================
# [Profile: local] 로컬 개발 환경 (Local / Docker MySQL 8.0 연동)
# ==========================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/snowthing?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useAffectedRows=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME:snowuser}
    password: ${SNOWTHING_DB_PASSWORD:snowthing_pass_2026!}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

---
# ==========================================
# [Profile: docker] 로컬 Docker Compose 환경
# ==========================================
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://mysql:3306/snowthing?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useAffectedRows=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME:snowuser}
    password: ${SNOWTHING_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

---
# ==========================================
# [Profile: prod] AWS EC2 + RDS 운영 컨테이너 환경 (IAM 무암호 인증)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # 운영 계약: AWS Advanced JDBC Wrapper는 jdbc:aws-wrapper:mysql:// 접두사만 허용한다.
    url: ${SNOWTHING_PROD_DB_URL}
    driver-class-name: software.amazon.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME:snowthing_app}
    password: ${SNOWTHING_DB_PASSWORD:}
    hikari:
      # 댓글 커밋 뒤 알림 저장(REQUIRES_NEW)은 원래 커넥션을 쥔 채 하나를 더 잡는다. 동시 댓글이 몰려도 풀이 바닥나지 않게 넉넉히 둔다.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        wrapperPlugins: iam
        iamExpiration: 870
        useAffectedRows: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    com.ikae.snowthing: info

snowthing:
  email:
    verification:
      secret: ${SNOWTHING_EMAIL_VERIFICATION_SECRET}
  mail:
    provider: ${SNOWTHING_MAIL_PROVIDER:ses}
    region: ${SNOWTHING_SES_REGION:ap-northeast-2}
    from-address: ${SNOWTHING_MAIL_FROM:help@snowthing.org}
    from-name: ${SNOWTHING_MAIL_FROM_NAME:SnowThing}
    configuration-set: ${SNOWTHING_SES_CONFIGURATION_SET:}
  oauth2:
    frontend-base-url: ${SNOWTHING_FRONTEND_BASE_URL:https://snowthing.org}
    google:
      redirect-uri: ${SNOWTHING_GOOGLE_REDIRECT_URI:https://snowthing.org/api/v1/auth/oauth2/callback/google}
    naver:
      redirect-uri: ${SNOWTHING_NAVER_REDIRECT_URI:https://snowthing.org/api/v1/auth/oauth2/callback/naver}
    kakao:
      redirect-uri: ${SNOWTHING_KAKAO_LOGIN_REDIRECT_URI:https://snowthing.org/api/v1/auth/oauth2/callback/kakao}
  # 운영은 https로만 열리므로 쿠키에 Secure를 붙이고, 개발용 localhost 출처를 받지 않는다.
  web:
    secure-cookies: true
    allowed-origins: https://snowthing.org,https://www.snowthing.org
    websocket-allowed-origin-patterns: https://snowthing.org,https://www.snowthing.org

server:
  servlet:
    session:
      cookie:
        secure: true
