spring:
  application:
    name: snowthing

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  profiles:
    default: local

  jpa:
    open-in-view: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

logging:
  chat-audit:
    path: ${SNOWTHING_CHAT_AUDIT_LOG_PATH:logs/chat_audit.log}
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

snowthing:
  email:
    verification:
      secret: ${SNOWTHING_EMAIL_VERIFICATION_SECRET:local-development-email-verification-secret}
  mail:
    provider: ${SNOWTHING_MAIL_PROVIDER:disabled}
    region: ${SNOWTHING_SES_REGION:ap-northeast-2}
    from-address: ${SNOWTHING_MAIL_FROM:help@snowthing.org}
    from-name: ${SNOWTHING_MAIL_FROM_NAME:SnowThing}
    configuration-set: ${SNOWTHING_SES_CONFIGURATION_SET:}
  chat:
    max-connections: ${SNOWTHING_CHAT_MAX_CONNECTIONS:500}
  carpool:
    external:
      connect-timeout-millis: ${SNOWTHING_CARPOOL_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${SNOWTHING_CARPOOL_READ_TIMEOUT_MILLIS:4000}
      kakao:
        rest-api-key: ${SNOWTHING_KAKAO_REST_API_KEY:}
      opinet:
        api-key: ${SNOWTHING_OPINET_API_KEY:}

server:
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax

cloud:
  aws:
    s3:
      bucket: ${SNOWTHING_S3_BUCKET:snowthing-media-00001}
    cloudfront:
      base-url: ${SNOWTHING_IMAGE_BASE_URL:https://images.snowthing.org}

---
# ==========================================
# [Profile: local] 로컬 개발 환경 (Local / Docker MySQL 8.0 연동)
# ==========================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/snowthing?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useAffectedRows=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME:snowuser}
    password: ${SNOWTHING_DB_PASSWORD:snowthing_pass_2026!}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

---
# ==========================================
# [Profile: docker] 로컬 Docker Compose 환경
# ==========================================
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://mysql:3306/snowthing?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useAffectedRows=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME:snowuser}
    password: ${SNOWTHING_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

---
# ==========================================
# [Profile: prod] AWS EC2 + RDS 운영 컨테이너 환경 (IAM 무암호 인증)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # 운영 계약: AWS Advanced JDBC Wrapper는 jdbc:aws-wrapper:mysql:// 접두사만 허용한다.
    url: ${SNOWTHING_PROD_DB_URL}
    driver-class-name: software.amazon.jdbc.Driver
    username: ${SNOWTHING_DB_USERNAME:snowthing_app}
    password: ${SNOWTHING_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        wrapperPlugins: iam
        iamExpiration: 870
        useAffectedRows: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    com.ikae.snowthing: info

snowthing:
  email:
    verification:
      secret: ${SNOWTHING_EMAIL_VERIFICATION_SECRET}
  mail:
    provider: ${SNOWTHING_MAIL_PROVIDER:ses}
    region: ${SNOWTHING_SES_REGION:ap-northeast-2}
    from-address: ${SNOWTHING_MAIL_FROM:help@snowthing.org}
    from-name: ${SNOWTHING_MAIL_FROM_NAME:SnowThing}
    configuration-set: ${SNOWTHING_SES_CONFIGURATION_SET:}
