# 컨테이너 로그가 디스크를 채우지 않게 서비스마다 50MB x 5개까지만 남긴다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  backend:
    image: ${BACKEND_IMAGE_URI:-snowthing-backend:latest}
    container_name: snowthing-backend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # backend entrypoint가 jdbc:aws-wrapper:mysql:// 접두사까지 검증한다.
      - SNOWTHING_PROD_DB_URL=${SNOWTHING_PROD_DB_URL:?SNOWTHING_PROD_DB_URL must be set and start with jdbc:aws-wrapper:mysql://}
      - SNOWTHING_DB_USERNAME=${SNOWTHING_DB_USERNAME:-snowthing_app}
      - SNOWTHING_DB_PASSWORD=${SNOWTHING_DB_PASSWORD:-}
      - SNOWTHING_S3_BUCKET=${SNOWTHING_S3_BUCKET:-snowthing-media-00001}
      - SNOWTHING_IMAGE_BASE_URL=${SNOWTHING_IMAGE_BASE_URL:-https://images.snowthing.org}
      - SNOWTHING_KAKAO_REST_API_KEY=${SNOWTHING_KAKAO_REST_API_KEY:?SNOWTHING_KAKAO_REST_API_KEY must be set}
      - SNOWTHING_OPINET_API_KEY=${SNOWTHING_OPINET_API_KEY:?SNOWTHING_OPINET_API_KEY must be set}
      - SNOWTHING_KMA_SERVICE_KEY=${SNOWTHING_KMA_SERVICE_KEY:-}
      - SNOWTHING_FRONTEND_BASE_URL=${SNOWTHING_FRONTEND_BASE_URL:-https://snowthing.org}
      - SNOWTHING_GOOGLE_CLIENT_ID=${SNOWTHING_GOOGLE_CLIENT_ID:-}
      - SNOWTHING_GOOGLE_CLIENT_SECRET=${SNOWTHING_GOOGLE_CLIENT_SECRET:-}
      - SNOWTHING_GOOGLE_REDIRECT_URI=${SNOWTHING_GOOGLE_REDIRECT_URI:-https://snowthing.org/api/v1/auth/oauth2/callback/google}
      - SNOWTHING_NAVER_CLIENT_ID=${SNOWTHING_NAVER_CLIENT_ID:-}
      - SNOWTHING_NAVER_CLIENT_SECRET=${SNOWTHING_NAVER_CLIENT_SECRET:-}
      - SNOWTHING_NAVER_REDIRECT_URI=${SNOWTHING_NAVER_REDIRECT_URI:-https://snowthing.org/api/v1/auth/oauth2/callback/naver}
      - SNOWTHING_KAKAO_LOGIN_CLIENT_ID=${SNOWTHING_KAKAO_LOGIN_CLIENT_ID:-${SNOWTHING_KAKAO_REST_API_KEY}}
      - SNOWTHING_KAKAO_LOGIN_CLIENT_SECRET=${SNOWTHING_KAKAO_LOGIN_CLIENT_SECRET:-}
      - SNOWTHING_KAKAO_LOGIN_REDIRECT_URI=${SNOWTHING_KAKAO_LOGIN_REDIRECT_URI:-https://snowthing.org/api/v1/auth/oauth2/callback/kakao}
      - SNOWTHING_EMAIL_VERIFICATION_SECRET=${SNOWTHING_EMAIL_VERIFICATION_SECRET:?SNOWTHING_EMAIL_VERIFICATION_SECRET must be set}
      - SNOWTHING_MAIL_PROVIDER=${SNOWTHING_MAIL_PROVIDER:-ses}
      - SNOWTHING_SES_REGION=${SNOWTHING_SES_REGION:-ap-northeast-2}
      - SNOWTHING_MAIL_FROM=${SNOWTHING_MAIL_FROM:-help@snowthing.org}
      - SNOWTHING_MAIL_FROM_NAME=${SNOWTHING_MAIL_FROM_NAME:-SnowThing}
      - SNOWTHING_SES_CONFIGURATION_SET=${SNOWTHING_SES_CONFIGURATION_SET:-}
      - SNOWTHING_CHAT_AUDIT_LOG_PATH=/var/log/snowthing-chat/chat_audit.log
      - SNOWTHING_IMAGE_BUDGET_LOG_PATH=/var/log/snowthing-chat/image_budget.jsonl
      - SNOWTHING_CHAT_MAX_CONNECTIONS=${SNOWTHING_CHAT_MAX_CONNECTIONS:-500}
      - SNOWTHING_BOT_ENABLED=${SNOWTHING_BOT_ENABLED:-false}
      - SNOWTHING_CLOUDFRONT_DISTRIBUTION_ID=${SNOWTHING_CLOUDFRONT_DISTRIBUTION_ID:-}
      - SNOWTHING_BOT_BASE_URL=${SNOWTHING_BOT_BASE_URL:-http://mcp-bot:3100}
      - SNOWTHING_BOT_INTERNAL_SECRET=${SNOWTHING_BOT_INTERNAL_SECRET:-}
      - SNOWTHING_BOT_DELEGATION_SECRET=${SNOWTHING_BOT_DELEGATION_SECRET:-}
      - SNOWTHING_BOT_DELEGATION_TTL=${SNOWTHING_BOT_DELEGATION_TTL:-60s}
      - SNOWTHING_BOT_REQUEST_TIMEOUT=${SNOWTHING_BOT_REQUEST_TIMEOUT:-15s}
      # AI 멤버(IKA-14). 페르소나 파일은 저장소 밖 호스트 디렉터리에 둔다.
      - SNOWTHING_AI_MEMBERS_ENABLED=${SNOWTHING_AI_MEMBERS_ENABLED:-false}
      - SNOWTHING_AI_MEMBERS_PERSONA_FILE=/etc/snowthing-ai/personas.yml
      - SNOWTHING_AI_MEMBERS_DAILY_CALL_LIMIT=${SNOWTHING_AI_MEMBERS_DAILY_CALL_LIMIT:-100}
      - SNOWTHING_AI_MEMBERS_TOPIC_KEYWORDS=${SNOWTHING_AI_MEMBERS_TOPIC_KEYWORDS:-}
      # Discord 알림(IKA-18). 비어 있으면 그 채널 알림은 꺼진다.
      - DISCORD_WEBHOOK_ALERT=${DISCORD_WEBHOOK_ALERT:-}
      - DISCORD_WEBHOOK_EVENT=${DISCORD_WEBHOOK_EVENT:-}
      # 웹 푸시(IKA-65). 셋 중 하나라도 비어 있으면 휴대폰 알림 발송과 구독 등록이 꺼진다.
      - WEB_PUSH_VAPID_PUBLIC_KEY=${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      - WEB_PUSH_VAPID_PRIVATE_KEY=${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      - WEB_PUSH_VAPID_SUBJECT=${WEB_PUSH_VAPID_SUBJECT:-}
      # OOM 뒤 멈춘 채 남지 않고 종료되어 restart 정책으로 다시 뜨게 한다.
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -javaagent:/opt/pinpoint-agent/pinpoint-bootstrap.jar -Dpinpoint.agentId=${PINPOINT_AGENT_ID:-snowthing-prod-01} -Dpinpoint.applicationName=${PINPOINT_APPLICATION_NAME:-snowthing-backend-prod} -Dpinpoint.config=/opt/pinpoint-agent/snowthing-pinpoint.config
      - TZ=Asia/Seoul
    volumes:
      - /var/log/snowthing-chat:/var/log/snowthing-chat
      - /opt/pinpoint-agent-3.1.0:/opt/pinpoint-agent:ro
      - /var/log/pinpoint-agent:/opt/pinpoint-agent/logs
      - /opt/snowthing-ai:/etc/snowthing-ai:ro

  frontend:
    image: ${FRONTEND_IMAGE_URI:-snowthing-frontend:latest}
    container_name: snowthing-frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000

  mcp-bot:
    image: ${MCP_BOT_IMAGE_URI:-snowthing-mcp-bot:latest}
    container_name: snowthing-mcp-bot
    restart: unless-stopped
    logging: *default-logging
    init: true
    expose:
      - "3100"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-6-luna}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-low}
      - SNOWTHING_API_BASE_URL=http://backend:8080
      - SNOWTHING_BOT_INTERNAL_SECRET=${SNOWTHING_BOT_INTERNAL_SECRET:-}
      - SNOWTHING_BOT_HOST=0.0.0.0
      - SNOWTHING_BOT_PORT=3100
      - SNOWTHING_BOT_TIMEOUT_MS=${SNOWTHING_BOT_TIMEOUT_MS:-15000}
      - TZ=Asia/Seoul
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
