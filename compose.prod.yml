services:
  backend:
    image: ${BACKEND_IMAGE_URI:-snowthing-backend:latest}
    container_name: snowthing-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # backend entrypoint가 jdbc:aws-wrapper:mysql:// 접두사까지 검증한다.
      - SNOWTHING_PROD_DB_URL=${SNOWTHING_PROD_DB_URL:?SNOWTHING_PROD_DB_URL must be set and start with jdbc:aws-wrapper:mysql://}
      - SNOWTHING_DB_USERNAME=${SNOWTHING_DB_USERNAME:-snowthing_app}
      - SNOWTHING_DB_PASSWORD=${SNOWTHING_DB_PASSWORD:-}
      - SNOWTHING_S3_BUCKET=${SNOWTHING_S3_BUCKET:-snowthing-media-00001}
      - SNOWTHING_IMAGE_BASE_URL=${SNOWTHING_IMAGE_BASE_URL:-https://images.snowthing.org}
      - SNOWTHING_KAKAO_REST_API_KEY=${SNOWTHING_KAKAO_REST_API_KEY:?SNOWTHING_KAKAO_REST_API_KEY must be set}
      - SNOWTHING_OPINET_API_KEY=${SNOWTHING_OPINET_API_KEY:?SNOWTHING_OPINET_API_KEY must be set}
      - SNOWTHING_EMAIL_VERIFICATION_SECRET=${SNOWTHING_EMAIL_VERIFICATION_SECRET:?SNOWTHING_EMAIL_VERIFICATION_SECRET must be set}
      - SNOWTHING_MAIL_PROVIDER=${SNOWTHING_MAIL_PROVIDER:-ses}
      - SNOWTHING_SES_REGION=${SNOWTHING_SES_REGION:-ap-northeast-2}
      - SNOWTHING_MAIL_FROM=${SNOWTHING_MAIL_FROM:-help@snowthing.org}
      - SNOWTHING_MAIL_FROM_NAME=${SNOWTHING_MAIL_FROM_NAME:-SnowThing}
      - SNOWTHING_SES_CONFIGURATION_SET=${SNOWTHING_SES_CONFIGURATION_SET:-}
      - SNOWTHING_CHAT_AUDIT_LOG_PATH=/var/log/snowthing-chat/chat_audit.log
      - SNOWTHING_CHAT_MAX_CONNECTIONS=${SNOWTHING_CHAT_MAX_CONNECTIONS:-500}
      - SNOWTHING_BOT_ENABLED=${SNOWTHING_BOT_ENABLED:-false}
      - SNOWTHING_BOT_BASE_URL=${SNOWTHING_BOT_BASE_URL:-http://mcp-bot:3100}
      - SNOWTHING_BOT_INTERNAL_SECRET=${SNOWTHING_BOT_INTERNAL_SECRET:-}
      - SNOWTHING_BOT_DELEGATION_SECRET=${SNOWTHING_BOT_DELEGATION_SECRET:-}
      - SNOWTHING_BOT_DELEGATION_TTL=${SNOWTHING_BOT_DELEGATION_TTL:-60s}
      - SNOWTHING_BOT_REQUEST_TIMEOUT=${SNOWTHING_BOT_REQUEST_TIMEOUT:-15s}
      - JAVA_TOOL_OPTIONS=-javaagent:/opt/pinpoint-agent/pinpoint-bootstrap.jar -Dpinpoint.agentId=${PINPOINT_AGENT_ID:-snowthing-prod-01} -Dpinpoint.applicationName=${PINPOINT_APPLICATION_NAME:-snowthing-backend-prod} -Dpinpoint.config=/opt/pinpoint-agent/snowthing-pinpoint.config
      - TZ=Asia/Seoul
    volumes:
      - /var/log/snowthing-chat:/var/log/snowthing-chat
      - /opt/pinpoint-agent-3.1.0:/opt/pinpoint-agent:ro
      - /var/log/pinpoint-agent:/opt/pinpoint-agent/logs

  frontend:
    image: ${FRONTEND_IMAGE_URI:-snowthing-frontend:latest}
    container_name: snowthing-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000

  mcp-bot:
    image: ${MCP_BOT_IMAGE_URI:-snowthing-mcp-bot:latest}
    container_name: snowthing-mcp-bot
    restart: unless-stopped
    init: true
    expose:
      - "3100"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-6-luna}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-low}
      - SNOWTHING_API_BASE_URL=http://backend:8080
      - SNOWTHING_BOT_INTERNAL_SECRET=${SNOWTHING_BOT_INTERNAL_SECRET:-}
      - SNOWTHING_BOT_HOST=0.0.0.0
      - SNOWTHING_BOT_PORT=3100
      - SNOWTHING_BOT_TIMEOUT_MS=${SNOWTHING_BOT_TIMEOUT_MS:-15000}
      - TZ=Asia/Seoul
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
