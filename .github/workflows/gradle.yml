name: Java CI with Gradle

# PR 검사 전용이다. main push 때는 deploy-backend.yml의 ci-backend가 같은 검사를 돌린다.
on:
  pull_request:
    branches: [ "main" ]
    paths: [ 'backend/**', 'database/**', 'shared/**', 'scripts/run-production-migrations.sh', 'scripts/verify-production-migration-*.sh', '.github/workflows/gradle.yml' ]

permissions:
  contents: read

jobs:
  spotless:
    name: Spotless Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Spotless Linter Check
        run: ./gradlew spotlessCheck

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: spotless

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: snowthing_test
          MYSQL_USER: snowuser
          MYSQL_PASSWORD: snowthing_pass_2026!
          MYSQL_ROOT_PASSWORD: snowthing_root_2026!
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      SNOWTHING_DB_USERNAME: snowuser
      SNOWTHING_DB_PASSWORD: snowthing_pass_2026!
      SNOWTHING_TEST_DB_URL: jdbc:mysql://localhost:3306/snowthing_test?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useAffectedRows=true
      SNOWTHING_TEST_DB_USERNAME: snowuser
      SNOWTHING_TEST_DB_PASSWORD: snowthing_pass_2026!

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Allow test triggers and raise max_connections in MySQL
        env:
          MYSQL_ROOT_PASSWORD: snowthing_root_2026!
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -p"$MYSQL_ROOT_PASSWORD" \
            -e "SET GLOBAL log_bin_trust_function_creators = 1; SET GLOBAL max_connections = 500;"

      - name: Verify production migration 003 from the existing schema
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/run-production-migrations.sh scripts/verify-production-migration-003.sh
          scripts/verify-production-migration-003.sh

      - name: Verify production migrations 005-006 schema
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/run-production-migrations.sh scripts/verify-production-migration-005.sh scripts/verify-production-migration-006.sh
          scripts/verify-production-migration-005.sh
          scripts/verify-production-migration-006.sh

      - name: Verify production migrations 007-015 schema
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/run-production-migrations.sh scripts/verify-production-migration-007-015.sh
          scripts/verify-production-migration-007-015.sh

      # 위 단계가 001부터 최신까지 적용한 스키마에서 ddl-auto=validate로 기동해 엔티티와 대조한다. 일반 test는 create-drop이라 먼저 돌린다.
      - name: Validate JPA entities against migrated schema
        run: ./gradlew schemaValidate -x spotlessCheck

      - name: Build and Test with Gradle
        run: ./gradlew test build -x spotlessCheck
