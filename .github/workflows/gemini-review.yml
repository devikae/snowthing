name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Gemini Code Review
        uses: primaryfeather/gemini-pr-reviewer-action@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: "gemini-1.5-flash"
          language: "ko-KR"
          prompt: |
            당신은 시니어 개발자이자 코드 리뷰어입니다. 한국어로 친절하고 명확하게 코드 품질, 잠재적 버그, 리팩토링 제안을 리뷰해 주세요.
            문제점이 있다면 다른 대안과 장단점, 트레이드오프를 설명하여 개발자의 성장을 돕는 리뷰를 남겨주세요.
