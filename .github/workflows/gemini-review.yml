name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gemini Review via REST API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY 시크릿이 비어있습니다."
            exit 1
          fi

          # 1. PR Diff 추출 (최대 8KB)
          PR_DIFF=$(gh pr diff $PR_NUMBER | head -c 8000)

          # 2. JSON Payload 구성 (jq 안전 이스케이프)
          PROMPT="당신은 10년 차 시니어 소프트웨어 아키텍트이자 멘토입니다. 아래 PR Diff를 분석하여 1) PR 핵심 요약, 2) Good Parts, 3) 잠재적 버그/개선점, 4) 대안 비교 및 트레이드오프 순으로 한국어로 정밀하게 코드 리뷰해 주세요.\n\n[PR Diff]:\n$PR_DIFF"
          PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')

          # 3. Google AI REST API 호출 (gemini-3.6-flash 모델 지정)
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          # 4. 리뷰 결과 파싱
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$REVIEW_TEXT" ]; then
            echo "::error::Gemini API 응답 실패: $RESPONSE"
            exit 1
          fi

          # 5. GitHub CLI로 PR 댓글 등록
          gh issue comment $PR_NUMBER --body "### 🤖 Gemini AI PR Code Review

          $REVIEW_TEXT"
