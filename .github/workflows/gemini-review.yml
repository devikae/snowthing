name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini Review via REST API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY 시크릿이 비어있습니다."
            exit 1
          fi

          # 1. frontend, .github(깃액션), docs(문서) 100% 원천 제외하고 순수 코드 변경점만 추출
          git fetch origin $TARGET_BRANCH
          PR_DIFF=$(git diff origin/$TARGET_BRANCH...HEAD -- '.' ':!frontend/' ':!.github/' ':!docs/' | head -c 12000)

          if [ -z "$PR_DIFF" ]; then
            PR_DIFF="리뷰할 백엔드 비즈니스 소스코드 변경점이 없습니다."
          fi

          # 2. 깃 액션 피드백 엄격 금지 & 시니어 멘토링 프롬프트 주입
          PROMPT="당신은 10년 차 이상의 시니어 소프트웨어 아키텍트이자 따뜻하고 정교한 코드 리뷰 멘토입니다. 주니어 개발자(멘티)가 작성한 PR 코드 변경사항(Diff)을 정밀 분석하여, 상황에 맞는 기술을 주도적으로 선택하고 판단할 수 있는 좋은 개발자로 성장시키는 것이 당신의 최종 목표입니다.\n\n⛔ [엄격한 금지 지침]: 절대로 GitHub Actions, CI/CD 워크플로우 설정 파일(.github/), 라벨러, YML 설정에 대해 리뷰하거나 언급하지 마세요. 오직 백엔드 자바/스프링 애플리케이션 비즈니스 소스코드와 아키텍처에 대해서만 리뷰하세요.\n\n### 📋 멘토링 코드 리뷰 구조:\n1. 🔍 **[PR 백엔드 핵심 요약]**: 이번 PR 백엔드 변경 사항의 엔지니어링 및 아키텍처적 핵심을 2~3줄로 요약해 주세요.\n2. 🏛️ **[아키텍처 & 시스템 구조 리뷰 (Architecture & System Design)]**: 백엔드 레이어 구조(Controller-Service-Repository), 서블릿/스프링 컨테이너 흐름, 데이터베이스/캐시 연동, 인프라 및 보안 체계 관점에서 시스템의 구조적 장점과 개선점, 위험 요소를 파헤쳐 주세요. 개선점에 대해 다른 대안 기술 2~3가지, 물리적 원리, 장단점, Trade-off 및 서비스/아키텍처 레벨 극복 방안을 설명해 주세요.\n3. 💻 **[소스코드 품질 & 객체지향/스프링 리뷰 (Code Quality & Spring Best Practices)]**: 실제 자바 소스코드의 클래스 설계, 객체지향 원칙(SOLID), 스프링 핵심 기술(@Transactional, 빈 분리, 유효성 검증), 쿼리 성능(N+1, 인덱스, 영속성 컨텍스트), 예외 처리 및 데이터 무결성 측면에서 코드 레벨 명세를 정밀 지적해 주세요.\n4. 🛠️ **[개선된 코드 예시 (Before vs After)]**: 멘티가 상황에 맞는 기술을 직관적으로 이해하고 적용할 수 있도록 가독성이 뛰어난 자바(Java / Spring Boot) diff 또는 소스코드 블록 예시를 제공해 주세요.\n\n---\n[PR 소스코드 변경사항 Diff]:\n$PR_DIFF"
          
          PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')

          # 3. Google AI REST API 호출 (gemini-3.6-flash)
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          # 4. 리뷰 결과 파싱
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$REVIEW_TEXT" ]; then
            echo "::error::Gemini API 응답 실패: $RESPONSE"
            exit 1
          fi

          # 5. GitHub CLI로 PR 댓글 등록
          gh issue comment $PR_NUMBER --body "### 🤖 Gemini AI PR Code Review

          $REVIEW_TEXT"
