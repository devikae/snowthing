name: Manage ECR Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 실행할 작업
        required: true
        type: choice
        options: [rollback, mark-stable]
      service:
        description: 대상 서비스
        required: true
        type: choice
        options: [backend, frontend]
      source_tag:
        description: release/stable-<전체 SHA>[-<12자리 설정지문>]
        required: true
        type: string

concurrency:
  group: ec2-production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  manage-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate input
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_TAG" =~ ^(release|stable)-[0-9a-f]{40}(-[0-9a-f]{12})?$ ]]; then
            echo "태그 형식은 release/stable-<40자리 SHA>[-<12자리 설정지문>]이어야 합니다." >&2
            exit 2
          fi
          if [[ "$OPERATION" == "mark-stable" && ! "$SOURCE_TAG" =~ ^release- ]]; then
            echo "stable 지정은 release 태그에서만 가능합니다." >&2
            exit 2
          fi

      - uses: actions/checkout@v7

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve repository and digest
        id: image
        env:
          SERVICE: ${{ inputs.service }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          if [[ "$SERVICE" == "backend" ]]; then
            REPOSITORY="${{ vars.ECR_BACKEND_REPOSITORY }}"
          else
            REPOSITORY="${{ vars.ECR_FRONTEND_REPOSITORY }}"
          fi
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          DIGEST=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$SOURCE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "image_uri=$REGISTRY/$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Roll back to selected digest via SSM
        if: inputs.operation == 'rollback'
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SERVICE: ${{ inputs.service }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          DEPLOY_SHA="${SOURCE_TAG#*-}"
          DEPLOY_SHA="${DEPLOY_SHA%%-*}"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          PARAMETERS=$(jq -n --arg sha "$DEPLOY_SHA" --arg image "$IMAGE_URI" --arg region "$AWS_REGION" --arg service "$SERVICE" '{commands: [
            "set -e", "cd /home/ubuntu/snowthing",
            "git -c safe.directory=/home/ubuntu/snowthing fetch --no-tags origin \"" + $sha + "\"",
            "git -c safe.directory=/home/ubuntu/snowthing reset --hard \"" + $sha + "\"",
            "test \"$(git -c safe.directory=/home/ubuntu/snowthing rev-parse HEAD)\" = \"" + $sha + "\"",
            "chmod +x scripts/deploy-ecr-service.sh",
            "scripts/deploy-ecr-service.sh \"" + $service + "\" \"" + $image + "\" \"" + $region + "\""
          ]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --timeout-seconds 900 --parameters "$PARAMETERS" --comment "Rollback $SERVICE to ${{ inputs.source_tag }}" --query 'Command.CommandId' --output text)
          STATUS=Pending
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Cancelled|TimedOut|Failed|Cancelling) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'
          test "$STATUS" = Success

      - name: Move release tag to stable
        if: inputs.operation == 'mark-stable'
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          STABLE_TAG="stable-${SOURCE_TAG#release-}"
          DIGEST=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$SOURCE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          MANIFEST=$(aws ecr batch-get-image --repository-name "$REPOSITORY" --image-ids imageDigest="$DIGEST" --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name "$REPOSITORY" --image-tag "$STABLE_TAG" --image-manifest "$MANIFEST" >/dev/null
          mapfile -t RELEASE_TAGS < <(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageDigest="$DIGEST" --query 'imageDetails[0].imageTags[?starts_with(@, `release-`)]' --output text | tr '\t' '\n')
          for tag in "${RELEASE_TAGS[@]}"; do
            [[ -n "$tag" ]] && aws ecr batch-delete-image --repository-name "$REPOSITORY" --image-ids imageTag="$tag" >/dev/null
          done
          echo "$STABLE_TAG -> $DIGEST"
