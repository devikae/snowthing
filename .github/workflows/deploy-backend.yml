name: Deploy Backend

on:
  push:
    branches: [ "main", "deploy/aws-ec2" ]
    paths: [ 'backend/**', 'database/**', 'compose.prod.yml', '.github/workflows/deploy-backend.yml' ]
  workflow_dispatch:

concurrency:
  group: ec2-production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci-backend:
    name: Backend CI (Spotless & Test)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: snowthing_test
          MYSQL_USER: snowuser
          MYSQL_PASSWORD: snowthing_pass_2026!
          MYSQL_ROOT_PASSWORD: snowthing_root_2026!
        ports: [ '3306:3306' ]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      SNOWTHING_DB_USERNAME: snowuser
      SNOWTHING_DB_PASSWORD: snowthing_pass_2026!
      SNOWTHING_TEST_DB_URL: jdbc:mysql://localhost:3306/snowthing_test?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SNOWTHING_TEST_DB_USERNAME: snowuser
      SNOWTHING_TEST_DB_PASSWORD: snowthing_pass_2026!
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Spotless Linter Check
        run: ./gradlew spotlessCheck
      - name: Build and Test with Gradle
        run: ./gradlew test build -x spotlessCheck

  deploy-backend:
    name: Deploy Backend to EC2
    needs: [ci-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/aws-ec2'
    steps:
      - name: Diagnose GitHub OIDC claims
        run: |
          set -euo pipefail
          TOKEN_RESPONSE=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | jq -r '.value')
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ l=length($0)%4; if (l==2) printf "%s==", $0; else if (l==3) printf "%s=", $0; else printf "%s", $0 }' | base64 -d 2>/dev/null)
          printf '%s' "$PAYLOAD" | jq '{sub, aud, repository, ref, event_name}'

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy Backend via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PARAMETERS=$(jq -n --arg branch "$DEPLOY_BRANCH" '{commands: [
            "set -e", "echo \"=== [1/4] 배포 브랜치 동기화 ===\"", "cd /home/ubuntu/snowthing", "git config --global --add safe.directory /home/ubuntu/snowthing",
            "git fetch origin \"" + $branch + "\"", "git reset --hard \"origin/" + $branch + "\"",
            "echo \"=== [2/4] 백엔드 이미지 빌드 및 컨테이너 배포 ===\"",
            "docker compose --env-file /etc/snowthing/prod.env -f compose.prod.yml up -d --build backend",
            "echo \"=== [3/4] 사용하지 않는 이미지 정리 ===\"", "docker image prune -f",
            "echo \"=== [4/4] 백엔드 헬스체크 ===\"",
            "for i in $(seq 1 12); do HTTP_STATUS=$(curl -s -o /dev/null -w \"%{http_code}\" http://127.0.0.1:8080/api/v1/master/resorts || true); if [ \"$HTTP_STATUS\" = \"200\" ]; then echo \"백엔드 헬스체크 성공 (HTTP 200)\"; exit 0; fi; echo \"백엔드 시작 대기 중 ($i/12, HTTP $HTTP_STATUS)\"; sleep 5; done; echo \"백엔드 헬스체크 실패\"; docker logs --tail 30 snowthing-backend; exit 1"
          ]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --timeout-seconds 900 --parameters "$PARAMETERS" --comment "Deploy backend from ${GITHUB_REPOSITORY}@${GITHUB_SHA}" --query 'Command.CommandId' --output text)
          echo "SSM command ID: $COMMAND_ID"
          STATUS=Pending
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Cancelled|TimedOut|Failed|Cancelling) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'
          test "$STATUS" = Success
